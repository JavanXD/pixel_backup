name: GitHub Pages (Pixel Backup landing page)

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "robots.txt"
      - "sitemap.xml"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare site files
        run: |
          set -euo pipefail
          mkdir -p pages/docs/screenshots
          cp index.html robots.txt sitemap.xml pages/
          cp docs/screenshots/ui-config.png pages/docs/screenshots/ui-config.png

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
