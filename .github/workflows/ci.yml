name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "PixelBackupApp/**"
      - "pixel_backup.sh"
      - ".github/workflows/ci.yml"
      - ".github/actions/setup-adb/**"
  pull_request:
    branches: [main]
    paths:
      - "PixelBackupApp/**"
      - "pixel_backup.sh"
      - ".github/workflows/ci.yml"
      - ".github/actions/setup-adb/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & lint
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup adb
        uses: ./.github/actions/setup-adb

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            PixelBackupApp/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-debug-${{ hashFiles('PixelBackupApp/Package.swift', 'PixelBackupApp/Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-debug-

      - name: Build (debug)
        run: swift build --package-path PixelBackupApp

      - name: Lint pixel_backup.sh
        run: bash -n pixel_backup.sh && echo "Shell script syntax OK"
