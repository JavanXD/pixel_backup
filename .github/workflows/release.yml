name: Release

# Triggered by a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build DMG & publish release
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME"   >> "$GITHUB_OUTPUT"

      - name: Check secrets
        id: secrets
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          [ -n "$CERT" ]     && echo "has_cert=true"     >> "$GITHUB_OUTPUT" || echo "has_cert=false"     >> "$GITHUB_OUTPUT"
          [ -n "$APPLE_ID" ] && echo "has_apple_id=true" >> "$GITHUB_OUTPUT" || echo "has_apple_id=false" >> "$GITHUB_OUTPUT"

      - name: Setup adb
        uses: ./.github/actions/setup-adb

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            PixelBackupApp/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-release-${{ hashFiles('PixelBackupApp/Package.swift', 'PixelBackupApp/Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-release-

      - name: Inject version into Info.plist
        run: |
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" \
            PixelBackupApp/Sources/PixelBackup/Info.plist
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleVersion ${{ github.run_number }}" \
            PixelBackupApp/Sources/PixelBackup/Info.plist
          echo "CFBundleShortVersionString=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' PixelBackupApp/Sources/PixelBackup/Info.plist)"
          echo "CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' PixelBackupApp/Sources/PixelBackup/Info.plist)"

      - name: Build universal binary (arm64 + x86_64)
        run: |
          set -euo pipefail
          swift build -c release --arch arm64  --package-path PixelBackupApp
          swift build -c release --arch x86_64 --package-path PixelBackupApp
          mkdir -p PixelBackupApp/.build/release
          lipo -create -output PixelBackupApp/.build/release/PixelBackup \
            PixelBackupApp/.build/arm64-apple-macosx/release/PixelBackup \
            PixelBackupApp/.build/x86_64-apple-macosx/release/PixelBackup
          lipo -info PixelBackupApp/.build/release/PixelBackup

      - name: Assemble PixelBackup.app
        run: |
          APP=PixelBackup.app
          CONTENTS="$APP/Contents"
          mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources"

          cp PixelBackupApp/.build/release/PixelBackup "$CONTENTS/MacOS/PixelBackup"
          cp PixelBackupApp/Sources/PixelBackup/Info.plist "$CONTENTS/Info.plist"

          # Multi-arch builds place the resource bundle under the arch-specific dir.
          BUILT_RES=""
          for candidate in \
            "PixelBackupApp/.build/arm64-apple-macosx/release/PixelBackup_PixelBackup.bundle/Contents/Resources" \
            "PixelBackupApp/.build/x86_64-apple-macosx/release/PixelBackup_PixelBackup.bundle/Contents/Resources" \
            "PixelBackupApp/.build/release/PixelBackup_PixelBackup.bundle/Contents/Resources"
          do
            if [ -d "$candidate" ]; then
              BUILT_RES="$candidate"
              break
            fi
          done

          if [ -n "$BUILT_RES" ]; then
            cp -R "$BUILT_RES/"* "$CONTENTS/Resources/"
          else
            cp PixelBackupApp/Sources/PixelBackup/Resources/adb           "$CONTENTS/Resources/adb"
            cp PixelBackupApp/Sources/PixelBackup/Resources/pixel_backup.sh "$CONTENTS/Resources/pixel_backup.sh"
          fi

          # Privacy manifest must live at Contents/Resources/PrivacyInfo.xcprivacy
          if [ -f PixelBackupApp/Sources/PixelBackup/Resources/PrivacyInfo.xcprivacy ]; then
            cp PixelBackupApp/Sources/PixelBackup/Resources/PrivacyInfo.xcprivacy \
              "$CONTENTS/Resources/PrivacyInfo.xcprivacy"
          fi

          chmod +x "$CONTENTS/Resources/adb"
          chmod +x "$CONTENTS/Resources/pixel_backup.sh"

      - name: Import signing certificate
        if: steps.secrets.outputs.has_cert == 'true'
        env:
          P12_BASE64:  ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          echo "$P12_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import /tmp/cert.p12 -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign app (Developer ID)
        if: steps.secrets.outputs.has_cert == 'true'
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_APP }}
          ENTITLEMENTS: PixelBackupApp/PixelBackup.entitlements
        run: |
          codesign --force --options runtime \
            --entitlements "$ENTITLEMENTS" \
            --sign "$DEVELOPER_ID" \
            PixelBackup.app/Contents/Resources/adb
          codesign --force --options runtime --deep \
            --entitlements "$ENTITLEMENTS" \
            --sign "$DEVELOPER_ID" \
            PixelBackup.app
          codesign --verify --deep --strict --verbose=2 PixelBackup.app

      - name: Sign app (ad-hoc fallback)
        if: steps.secrets.outputs.has_cert == 'false'
        run: |
          codesign --force --deep --sign - \
            --entitlements PixelBackupApp/PixelBackup.entitlements \
            PixelBackup.app
          echo "⚠️  Ad-hoc signed — users must right-click → Open on first launch"

      - name: Notarize app
        if: steps.secrets.outputs.has_cert == 'true' && steps.secrets.outputs.has_apple_id == 'true'
        env:
          APPLE_ID:       ${{ secrets.APPLE_ID }}
          NOTARY_TEAM:    ${{ secrets.NOTARY_TEAM }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          ditto -c -k --keepParent PixelBackup.app /tmp/PixelBackup-notarize.zip
          xcrun notarytool submit /tmp/PixelBackup-notarize.zip \
            --apple-id   "$APPLE_ID" \
            --team-id    "$NOTARY_TEAM" \
            --password   "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple PixelBackup.app
          spctl --assess --type execute --verbose PixelBackup.app

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-create-dmg-v1
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Install create-dmg
        run: brew list create-dmg &>/dev/null || brew install create-dmg

      - name: Create DMG
        id: dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG="PixelBackup-${VERSION}.dmg"

          create-dmg \
            --volname "PixelBackup" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "PixelBackup.app" 160 185 \
            --hide-extension "PixelBackup.app" \
            --app-drop-link 500 185 \
            "$DMG" \
            PixelBackup.app || true

          if [ ! -f "$DMG" ]; then
            hdiutil create -volname PixelBackup \
              -srcfolder PixelBackup.app \
              -ov -format UDZO "$DMG"
          fi

          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "name=$DMG" >> "$GITHUB_OUTPUT"
          ls -lh "$DMG"

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          CHANGELOG=$(awk '
            /^## \[/ { if (found) exit; found=1; next }
            found { print }
          ' CHANGELOG.md)

          sed "s/{version}/$VERSION/g" .github/release_template.md > /tmp/release_notes.md
          printf '\n---\n\n## Changes in this release\n\n' >> /tmp/release_notes.md
          echo "$CHANGELOG" >> /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          PRERELEASE_FLAG=""
          [[ "$TAG" == *-* ]] && PRERELEASE_FLAG="--prerelease"
          gh release create "$TAG" \
            --title "Pixel Backup $TAG" \
            --notes-file /tmp/release_notes.md \
            $PRERELEASE_FLAG \
            "$DMG" \
            pixel_backup.sh
